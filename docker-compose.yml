services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - LEXICON_CORS_ORIGINS=http://localhost:5173
      - PORT=8000
    ports:
      - "8000:8000"
  web:
    image: node:20-alpine
    working_dir: /web
    volumes:
      - ./frontend:/web
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - api
